<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Orion Link — Centro de Mando Ejecutivo Multi-Rol</title>
  <link rel="icon" type="image/svg+xml" href="../assets/img/orion-link-mark.svg">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body data-page="dashboard">
  <header class="topbar">
    <a href="../index.html" class="brand" aria-label="Orion Link Inicio">
      <span class="brand-mark-tile">
        <img src="../assets/img/orion-link-mark.svg" alt="Orion Link Isotipo">
      </span>
      <span class="brand-divider" aria-hidden="true"></span>
      <span class="brand-wordmark">
        <span class="brand-wordmark-orion">Orion</span>
        <span class="brand-wordmark-link">Link</span>
      </span>
      <span class="brand-badge">FTTH · NOC</span>
    </a>
    <div class="topbar-actions">
      <span class="badge badge-info" id="current-user-display">Verificando sesión...</span>
      <button type="button" class="api-status-pill" data-api-indicator>
        <span class="status-dot" data-api-dot></span>
        <span data-api-text>API</span>
      </button>
      <button type="button" class="btn btn-outline btn-sm" id="btn-refresh-dashboard">Sincronizar</button>
      <button type="button" class="btn btn-outline btn-sm" data-action="toggle-theme">Modo Noche NOC</button>
      <button type="button" class="btn btn-danger btn-sm" id="btn-logout">Cerrar Sesión</button>
    </div>
  </header>

  <main class="container">
    <!-- Barra de Navegación Multipágina Filtrada por Rol RBAC -->
    <nav class="tabs" id="role-page-nav" aria-label="Navegación Multipágina por Rol"></nav>

    <!-- Encabezado Dinámico Polimórfico según el Rol Autenticado -->
    <section class="card" style="margin-bottom: 1.25rem;">
      <span class="badge badge-info" id="role-workspace-badge">CARGANDO ROL</span>
      <h1 id="role-workspace-title" style="font-size: 1.45rem; margin: 0.45rem 0 0.25rem;">Consola Operativa Orion Link</h1>
      <p id="role-workspace-subtitle" style="font-size: 0.9rem; color: var(--text-secondary);"></p>
    </section>

    <!-- Banner de Alerta Temprana de Falla Masiva FTTH -->
    <div id="active-outage-banner" class="outage-alert-banner hidden"></div>

    <!-- Widget Exclusivo Polimórfico por Rol -->
    <section id="role-exclusive-widget"></section>

    <!-- KPIs Polimórficos Específicos para cada uno de los 4 Roles -->
    <section class="kpi-grid" id="role-kpi-grid"></section>

    <!-- Directorio de Vistas Operativas Desacopladas Autorizadas para este Rol -->
    <section class="card">
      <div class="card-header">
        <h2 class="card-title">Módulos Operativos Autorizados para Tu Rol (Vistas HTML Independientes)</h2>
        <span class="badge badge-info">Arquitectura Multipágina RBAC</span>
      </div>
      <div class="form-grid" id="role-module-directory"></div>
    </section>
  </main>

  <script type="module" src="../js/app.js"></script>
</body>
</html>
